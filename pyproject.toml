[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-migration-toolkit"
version = "0.1.0"
description = "Generic, reusable database migration and rollback framework"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "ibm_db>=3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.scripts]
dbmigrate = "dbmigrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmigrate"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dbmigrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
